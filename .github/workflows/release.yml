name: Release Windows App

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example 1.0.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-windows:
    name: Build and publish Windows release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Set workflow dispatch version
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          npm version ${{ inputs.version }} --no-git-tag-version

      - name: Build frontend
        run: npm run build:web

      - name: Build Electron app
        run: npx electron-builder --win --publish never

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release delete $tag --repo $env:GITHUB_REPOSITORY --yes 2>$null || $true
          gh release create $tag `
            --repo $env:GITHUB_REPOSITORY `
            --title $tag `
            --notes "SmartEat Printer Agent $tag" `
            --latest `
            "dist6/latest.yml" `
            "dist6/SmartEat Printer Agent Setup $($tag.TrimStart('v')).exe" `
            "dist6/SmartEat Printer Agent Setup $($tag.TrimStart('v')).exe.blockmap" `
            "dist6/SmartEat Printer Agent $($tag.TrimStart('v')).exe"

      - name: Publish manual workflow release
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v${{ inputs.version }}"
          gh release delete $tag --repo $env:GITHUB_REPOSITORY --yes 2>$null || $true
          git tag $tag
          git push origin $tag --force
          gh release create $tag `
            --repo $env:GITHUB_REPOSITORY `
            --title $tag `
            --notes "SmartEat Printer Agent $tag" `
            --latest `
            "dist6/latest.yml" `
            "dist6/SmartEat Printer Agent Setup ${{ inputs.version }}.exe" `
            "dist6/SmartEat Printer Agent Setup ${{ inputs.version }}.exe.blockmap" `
            "dist6/SmartEat Printer Agent ${{ inputs.version }}.exe"

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-files
          path: dist6/**
